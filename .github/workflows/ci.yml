# Tests of the AI surface (Bun packages on Windows and Linux, Rust workspace on Linux) and the reproducibility of the extraction.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  bun:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test ./frameworks/ai-os/test
      - run: bun test ./tools/extract.test.ts ./tools/first-party.test.ts
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - uses: oven-sh/setup-bun@v2
      - run: cargo check --workspace --all-targets
      # Standalone published crates: one dependency graph each.
      - run: bun tools/crates.ts --jobs=2
  extract:
    # The tree is the output of tools/extract.ts at the rev pinned in extract.toml: running it again must change nothing.
    # The tool fetches that rev into .cache/legacy-rev by itself and fails when it cannot: this check never passes without its source.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun tools/extract.ts
      - run: git diff --exit-code
