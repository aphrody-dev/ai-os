[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aphrody-env-kit-loader"
version = "0.1.0"
description = "Zero-dependency Python loader and secret redaction guard for the monorepo .env"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
only-include = ["sovereign_env.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
