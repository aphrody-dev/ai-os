[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "py2bun"
version = "0.1.0"
description = "Python 3 to Bun TypeScript transpiler (Rust, ruff_python_parser) with Ghidra script idioms"
requires-python = ">=3.9"
readme = "README.md"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]

[project.scripts]
py2bun = "py2bun.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.maturin]
manifest-path = "../py2bun/Cargo.toml"
python-source = "python"
module-name = "py2bun._py2bun"
features = ["python"]
bindings = "pyo3"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
