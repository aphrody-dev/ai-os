[package]
name = "aphrody-core-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["c-abi", "ffi", "tree-sitter", "reverse-engineering", "aphrody"]
categories = ["api-bindings", "development-tools::ffi"]
description = "One C ABI cdylib: core_* (aphrody-core), ai_os_*, depot_*, aphrody_re_* and Boq (aphrody_*), loaded by bun:ffi, Python, and Java"

[lib]
name = "aphrody_core_capi"
crate-type = ["cdylib", "rlib"]


[features]
default = ["core", "ai-os", "pipeline", "depot", "re", "web"]
core = ["dep:aphrody-core"]
# core_pipeline_* : the in-process index pipeline (tree-sitter and document stages) over the same SQLite file as `ay index`.
pipeline = ["core", "aphrody-core/pipeline"]
ai-os = ["dep:agent-context", "dep:rusqlite"]
# depot_*: depot engines (gix, just, ingest, graph, forge, migrate) over the core parsers.
depot = [
  "core",
  "dep:depot-core",
  "dep:depot-migrate",
  "dep:depot-forge",
  "dep:depot-ingest",
  "dep:depot-graph",
]
# aphrody_re_*, aphrody_ghidra_*, aphrody_mingw_*, aphrody_lua52_*: reverse engineering (aphrody-re).
re = ["dep:aphrody-re"]
# aphrody_* Boq parser (corelib).
web = ["dep:corelib"]
aysys-link = []

[dependencies]
agent-context = { workspace = true, optional = true }
c-abi.workspace = true
aphrody-core = { workspace = true, optional = true }
aphrody-re = { workspace = true, optional = true }
corelib = { workspace = true, optional = true }
depot-core = { workspace = true, optional = true }
depot-migrate = { workspace = true, optional = true }
depot-forge = { workspace = true, optional = true }
depot-ingest = { workspace = true, optional = true }
depot-graph = { workspace = true, optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
serde.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
# lore-server's telemetry reads cfg(tokio_unstable). Declared here because a crate cannot
# have its own lints table alongside `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 } # TODO(raghav.narula) Enable after duplicate dependencies fixed
# undocumented_unsafe_blocks = "warn" # TODO(raghav.narula) enable in follow up
checked_conversions = "warn"
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
