language = "C"
include_guard = "APHRODY_CORE_H"
autogen_warning = "/* Generated by cbindgen from system/core/capi (just core-header). Do not edit. */"
usize_is_size_t = true
cpp_compat = true

[export]
exclude = ["dlopen", "dlsym", "dlclose"]

[parse]
# aphrody_abi_version, aphrody_free and the ABI constants live in open's crates/c-abi.
parse_deps = true
include = ["c-abi"]
extra_bindings = ["c-abi"]
