[package]
name = "aphrody-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tree-sitter", "ast", "indexing", "blake3", "aphrody"]
categories = ["development-tools", "parsing"]
description = "Common lib: tree-sitter parsing, symbol/ref index, content hashing (BLAKE3)"

[lib]
name = "aphrody_core"


[features]
default = []
# One content-addressed stage graph over the monorepo: detect -> parse/triage -> deep -> SQLite
# (WAL, FTS5), with a Valkey cache/queue shared by the fleet (system/core/src/pipeline, docs/native/PIPELINE.md).
pipeline = ["dep:rusqlite", "dep:zstd"]
# The `aphrody-code` binary and `aphrody_core::cli`: facts queries, outlines, grammar registry and its upstream sync.
cli = ["dep:clap", "dep:ureq", "dep:toml", "dep:zstd"]
# build.rs compiles the parser.c of every third_party/tree-sitter-* clone into the registry (GRAMMARS): tens of MB of tables, so off by default.
grammars = []

[[bin]]
name = "aphrody-code"
path = "src/bin/code.rs"
required-features = ["cli"]

[dependencies]
clap = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
zstd = { workspace = true, optional = true }
blake3.workspace = true
ignore.workspace = true
rayon.workspace = true
serde_json.workspace = true
tree-sitter.workspace = true
tree-sitter-language.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-json.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-html.workspace = true
tree-sitter-css.workspace = true
tree-sitter-lua.workspace = true
tree-sitter-md.workspace = true
serde.workspace = true
streaming-iterator.workspace = true
ropey.workspace = true

[build-dependencies]
cc = { workspace = true }
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
toml.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
# lore-server's telemetry reads cfg(tokio_unstable). Declared here because a crate cannot
# have its own lints table alongside `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 } # TODO(raghav.narula) Enable after duplicate dependencies fixed
# undocumented_unsafe_blocks = "warn" # TODO(raghav.narula) enable in follow up
checked_conversions = "warn"
dbg_macro = "deny"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
