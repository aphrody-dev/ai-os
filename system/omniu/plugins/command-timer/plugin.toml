name = "command-timer"
version = "1.0.0"
kind = "source"
entry = "command-timer.plugin.niu"
summary = "Report duration and exit code after every interactive command."
permissions = ["shell:source"]
required_binaries = []

[exports]
functions = ["__niu_timer_start", "__niu_timer_stop"]
hooks = ["preexec", "postcmd"]
