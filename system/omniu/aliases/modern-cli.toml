# Aliases of the modern-cli profile (unixwin/winuxsh-profiles). grep and find are deliberately not aliased: scripts depend on them.
[aliases]
ll = "eza -lh --icons --git --group-directories-first"
la = "eza -la --icons --git --group-directories-first"
l = "eza -CF --icons --git --group-directories-first"
ls = "eza --icons --git --group-directories-first"
lt = "eza --tree --level=2 --icons"
tree = "erd --icons"
cat = "bat -pp"
du = "dust"
df = "duf"
files = "fd"
