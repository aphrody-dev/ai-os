[package]
name = "ai-os-sql"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false
description = "Shared SQL owner for Aphrody: PostgreSQL pool (TLS by URL, pgvector), SQLite open policy (WAL, sqlite-vec), checksummed plain-SQL migrations and database URL resolution. Legacy crates.io name: aphrody-sql."

[features]
default = ["postgres"]
# PostgreSQL pool over deadpool-postgres and tokio-postgres-rustls, pgvector typed binds.
postgres = [
  "dep:deadpool-postgres",
  "dep:tokio-postgres",
  "dep:tokio-postgres-rustls",
  "dep:pgvector",
  "dep:rustls",
  "dep:rustls-native-certs",
  "dep:webpki-roots",
]
# SQLite (bundled rusqlite): open policy, VACUUM INTO, checkpoint, migrations.
sqlite = ["dep:rusqlite"]
# sqlite-vec `vec0` registered once as a SQLite auto extension.
vec = ["sqlite", "dep:sqlite-vec"]

[dependencies]
deadpool-postgres = { version = "0.14", optional = true }
pgvector = { version = "0.4", features = ["postgres", "halfvec"], optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
sha2 = "0.11.0"
sqlite-vec = { version = "0.1.9", optional = true }
thiserror = "2.0.20"
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"], optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "native-certs"], optional = true }
tracing = "0.1.44"
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
