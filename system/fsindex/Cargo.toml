[package]
name = "ai-os-fsindex"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false
description = "Persistent local-filesystem search index (SQLite FTS5), mirroring the Google desktop app's local_files.db. Metadata-only, privacy-bounded. Legacy crates.io name: aphrody-fsindex."

[dependencies]
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true }
thiserror = "2.0.20"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
