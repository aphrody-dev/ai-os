[package]
name = "ai-os-secrets"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false
description = "Secret store abstraction (env + plaintext file + AES-256-GCM/Argon2id encrypted file) with redacted Display/Debug, constant-time equality, and Zeroize-on-drop SecretValue newtype. Legacy crates.io name: aphrody-secrets."

[dependencies]
async-trait = "0.1.92"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0.20"
zeroize = { workspace = true, features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aes-gcm = { workspace = true }
argon2 = "0.6"
base64 = "0.23.1"
rand = "0.10.2"
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
