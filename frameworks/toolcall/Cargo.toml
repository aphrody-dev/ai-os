[package]
name = "ai-os-toolcall"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false
description = "Tool catalogue model for the aphrody agent engine: ToolDefinition (name / description / JSON-schema input & output), the async ToolExecutor trait, ToolExposure (Direct / Deferred / DirectModelOnly / Hidden), and a JsonSchema type with prompt-budget compaction passes. Inspired by OpenAI Codex tools (Apache-2.0). Legacy crates.io name: aphrody-toolcall."

[dependencies]
async-trait = { version = "0.1.92", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0.20"

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
