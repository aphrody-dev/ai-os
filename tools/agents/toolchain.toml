# Other agents: same plugins from the root marketplace (copy into their own cache, no link).
# mcp = exclusive list: any other MCP server of the agent is removed (the relay already exposes it).
[codex]
marketplace = "aphrody"
plugins = ["aphrody-skills@aphrody"]
mcp = ["relay"]

[agy]
plugins = ["aphrody-skills@aphrody"]
mcp = ["relay"]

# Agents configured by file: the MCP key is rewritten (other keys are kept, JSONC comments are not).
# Missing file = agent not installed, ignored.
[[mcpfile]]
agent = "opencode"
path = "{home}/.config/opencode/opencode.jsonc"
key = "mcp"
shape = "opencode"
mcp = ["relay"]

# Claude Desktop: stdio servers only; the stdio relay replaces the servers with a plaintext API key.
[[mcpfile]]
agent = "claude-desktop"
path = "{appdata}/Claude/claude_desktop_config.json"
key = "mcpServers"
shape = "stdio"
mcp = ["relay"]

[[mcpfile]]
agent = "pi"
path = "{home}/.pi/agent/mcp.json"
key = "mcpServers"
shape = "claude"
mcp = ["relay"]

[[mcpfile]]
agent = "gemini"
path = "{home}/.gemini/settings.json"
key = "mcpServers"
shape = "gemini"
mcp = ["relay"]

[gemini]
extensions = [".agents"]

# Links and copies forbidden: any link (symlink, junction) or same-name copy of a src skill in these folders is removed,
# the aphrody-skills plugin already provides it.
[cleanup]
link_dirs = [
  "{home}/.claude/skills",
  "{home}/.gemini/skills",
  "{home}/.agents/skills",
  "{home}/.codex/skills",
]
drop_copies = true
drop_skills = [
  "web-design-guidelines",
  "gpui-kit",
  "gpui-kit-design-guides",
  "webui-reference",
]
