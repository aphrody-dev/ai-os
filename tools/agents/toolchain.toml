# --- Aphrody MCP / AI Tools (kept) ---
# ~/.claude.json is the only list of MCP servers: the relay aggregates them (<server>__<tool>) for the other agents.
# Claude Code already declares them: it takes the relay without aggregate (/mcp/core); shared_url = full route of the others.
[[claude.mcp]]
name = "relay"
url = "http://127.0.0.1:8790/mcp/core"
shared_url = "http://127.0.0.1:8790/mcp"
headers_helper = "bun {src}/frameworks/ai-os/src/relay/headers.ts"
# agy has neither verifiable OAuth nor a header without a plaintext secret: same server over stdio, without authorization.
stdio_command = ["bun", "{src}/frameworks/ai-os/src/relay/cli.ts", "mcp-stdio"]
hosts = ["pc"]

[[claude.mcp]]
name = "cloudflare"
url = "https://mcp.cloudflare.com/mcp"
hosts = ["pc"]

[[claude.mcp]]
name = "cloudflare-docs"
url = "https://docs.mcp.cloudflare.com/mcp"
hosts = ["pc"]

# vercel (230 tools, team blocked since 2026-06) and rea (250 tools) are no longer declared in Claude Code:
# their tool names loaded in every session. rea stays reachable through the relay (hub_tools / hub_call).
[[claude.mcp]]
name = "vercel"
hosts = ["pc"]
state = "absent"

[[claude.mcp]]
name = "rea"
hosts = ["pc"]
state = "absent"

# Servers reserved for the relay (<relay folder>/hub.json): no tool in the clients' context.
[[hub.mcp]]
name = "rea"
# by package name through bun x, on Bun (--bun overrides the node shebang): no install path, no Node.js
command = ["bun", "x", "--bun", "rea-agents", "mcp"]
# JAVA_HOME comes from the user environment (no JDK patch path pinned here).
env = { GHIDRA_INSTALL_DIR = "{home}/AppData/Local/ghidra" }
install = ["bun", "add", "-g", "rea-agents"]
hosts = ["pc"]

# agent-desktop (67 tools) and agent-browser (33): also behind the relay (hub_tools / hub_call, desktop_use, browser_use).
[[claude.mcp]]
name = "agent-desktop"
hosts = ["pc"]
state = "absent"

[[claude.mcp]]
name = "agent-browser"
hosts = ["pc"]
state = "absent"

# Context7 MCP (tools resolve-library-id, query-docs). Anonymous use has a monthly quota; the CTX7_API_KEY vault entry lifts it.
[[hub.mcp]]
name = "context7"
url = "https://mcp.context7.com/mcp"
headers = { CONTEXT7_API_KEY = "CTX7_API_KEY" }

# Package registries, read live (crates.io v1 API, docs.rs links, registry.npmjs.org): versions, dist-tags, MSRV, features,
# yanked releases, search. hub_call registry__crates_search | registry__crate_info | registry__crate_readme |
# registry__npm_search | registry__npm_info. Library docs come from context7; every host runs it with its own bun.
[[hub.mcp]]
name = "registry"
command = ["bun", "{src}/frameworks/ai-os/src/relay/registry-mcp.ts"]

# GNU upstream tracker (system/gnu-ts feed: ftp.gnu.org, info-gnu, Savannah, GSRC, Guix, Rust equivalents, Linux kernel).
# hub_call gnu__gnu_status | gnu__gnu_search | gnu__gnu_package | gnu__gnu_feed | gnu__gnu_kernel; feed from GNU_FEED, GNU_HOME or https://gnu.aphrody.com/feed.json.
[[hub.mcp]]
name = "gnu"
command = ["{home}/.bun/bin/bun.exe", "{src}/frameworks/ai-os/src/relay/gnu-mcp.ts"]
hosts = ["pc"]

# Electron migration toolkit (system/electron-migrate through `ay electron`): analyze, migrate to Tauri v3 or GPUI, optimize, bench.
# hub_call electron__electron_analyze | electron__electron_migrate | electron__electron_optimize | electron__electron_bench; AY_BIN overrides `ay`.
[[hub.mcp]]
name = "electron"
command = ["{home}/.bun/bin/bun.exe", "{src}/frameworks/ai-os/src/relay/electron-mcp.ts"]
hosts = ["pc"]

# py2bun: Python to Bun TypeScript transpiler (system/py2bun-ts, crate system/py2bun). hub_call py2bun__py2bun_transpile.
[[hub.mcp]]
name = "py2bun"
command = ["{home}/.bun/bin/bun.exe", "{src}/frameworks/ai-os/src/relay/py2bun-mcp.ts"]
hosts = ["pc"]

# unixwin fusion: applet providers, the ay plugin manifest, the oh-my-niu bundle validator, the embedded Bash engine.
# hub_call unixwin__unixwin_applets | unixwin__unixwin_plugin_manifest | unixwin__unixwin_validate_bundle | unixwin__unixwin_sh; AY_BIN overrides `ay`.
[[hub.mcp]]
name = "unixwin"
command = ["{home}/.bun/bin/bun.exe", "{src}/frameworks/ai-os/src/relay/unixwin-mcp.ts"]
hosts = ["pc"]

# Hardcode and slop scanner (scripts/hygiene.ts). hub_call hygiene__hygiene_scan | hygiene__hygiene_rules.
[[hub.mcp]]
name = "hygiene"
command = ["{home}/.bun/bin/bun.exe", "{src}/scripts/hygiene-mcp.ts"]
hosts = ["pc"]

[[hub.mcp]]
name = "agent-desktop"
command = ["{bin}/agent-desktop.exe", "mcp"]
hosts = ["pc"]

[[hub.mcp]]
name = "agent-browser"
command = ["{bin}/agent-browser.exe", "mcp"]
hosts = ["pc"]

# Chrome DevTools MCP (ChromeDevTools/chrome-devtools-mcp 1.13.0, 33 outils; skills chrome-*): hub_call chrome-devtools__<tool>.
# Headless + disposable profile (the relay is a service without a desktop); Google usage statistics off; probe 2026-11-15: initialize + tools/list OK.
[[hub.mcp]]
name = "chrome-devtools"
# by package name through bun x, on Bun (--bun overrides the node shebang): no install path, no Node.js
command = ["bun", "x", "--bun", "chrome-devtools-mcp", "--headless", "--isolated", "--memoryDebugging", "--categoryExtensions", "--categoryNetworkMocks"]
env = { CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS = "1" }
install = ["bun", "add", "-g", "chrome-devtools-mcp"]
hosts = ["pc"]

